<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for leather texture and depth -->
    <linearGradient id="leatherBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7a2828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a1212;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="leatherHighlight" cx="40%" cy="35%">
      <stop offset="0%" style="stop-color:#8a3535;stop-opacity:0.6" />
      <stop offset="60%" style="stop-color:#6a2323;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4a1212;stop-opacity:0" />
    </radialGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#daa520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="magicalGlow" cx="50%" cy="45%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.8" />
      <stop offset="40%" style="stop-color:#daa520;stop-opacity:0.4" />
      <stop offset="70%" style="stop-color:#8b6914;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#4a1212;stop-opacity:0" />
    </radialGradient>
    
    <linearGradient id="spineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a0808;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#4a1212;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4a1212;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a0808;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="spineLeather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3a0f0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5a1818;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a0f0f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pagesGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9f4e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8dcc0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c4a0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pageEdgeShading" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4b090;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8dcc0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4b090;stop-opacity:1" />
    </linearGradient>
    
    <filter id="emboss">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="deepShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="shadowBlur"/>
      <feOffset dx="15" dy="25" result="shadowOffset"/>
      <feComponentTransfer in="shadowOffset">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadowOffset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="parchmentTexture" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e6d8b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c4a0;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="goldShine" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffd700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:0" />
    </radialGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  
  <!-- Parchment background with vignette -->
  <rect width="800" height="1000" fill="url(#parchmentTexture)"/>
  <rect width="800" height="1000" fill="radial-gradient(circle at center, transparent 30%, rgba(101, 67, 33, 0.2) 100%)"/>
  
  <!-- Magical ambient glow (bottom layer) -->
  <ellipse cx="410" cy="520" rx="300" ry="240" fill="url(#magicalGlow)" opacity="0.6"/>
  
  <!-- Deep book shadow with 3D perspective -->
  <path d="M180,320 L190,750 L630,800 L620,360 Z" fill="#000" opacity="0.2" filter="url(#deepShadow)"/>
  
  <!-- Bottom page edges (visible bottom of book) -->
  <g>
    <!-- Main page block bottom -->
    <path d="M190,745 L200,750 L620,790 L610,785 Z" fill="url(#pageEdgeShading)"/>
    
    <!-- Individual page layers for depth -->
    <path d="M193,744 L203,749 L617,788 L607,783 Z" fill="#e8dcc0" opacity="0.8"/>
    <path d="M196,743 L206,748 L614,786 L604,781 Z" fill="#ded0b0" opacity="0.7"/>
    <path d="M199,742 L209,747 L611,784 L601,779 Z" fill="#d4c4a0" opacity="0.6"/>
    
    <!-- Page edge details -->
    <line x1="220" y1="748" x2="600" y2="788" stroke="#c4b090" stroke-width="0.5" opacity="0.5"/>
    <line x1="250" y1="749" x2="605" y2="789" stroke="#c4b090" stroke-width="0.5" opacity="0.4"/>
    <line x1="280" y1="750" x2="610" y2="790" stroke="#c4b090" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- Left spine/binding -->
  <g>
    <!-- Main spine body -->
    <path d="M140,300 L150,305 L190,750 L180,745 Z" fill="url(#spineLeather)"/>
    
    <!-- Spine raised bands -->
    <path d="M145,330 L155,335 L195,345 L185,340 Z" fill="url(#spineGradient)"/>
    <path d="M148,380 L158,385 L198,395 L188,390 Z" fill="url(#spineGradient)"/>
    <path d="M151,430 L161,435 L201,445 L191,440 Z" fill="url(#spineGradient)"/>
    <path d="M154,480 L164,485 L204,495 L194,490 Z" fill="url(#spineGradient)"/>
    <path d="M157,530 L167,535 L207,545 L197,540 Z" fill="url(#spineGradient)"/>
    <path d="M160,580 L170,585 L210,595 L200,590 Z" fill="url(#spineGradient)"/>
    <path d="M152,690 L162,700 L202,710 L192,700 Z" fill="url(#spineGradient)"/>
    
    <!-- Spine gold decorative line -->
    <path d="M145,310 L155,320 L195,730 L185,740 Z" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Spine highlight -->
    <path d="M148,300 L158,310 L198,740 L188,750 Z" fill="rgba(255,255,255,0.08)"/>
    
    <!-- Spine shadow on inner edge -->
    <path d="M188,745 L190,745 L150,302 L148,302 Z" fill="rgba(0,0,0,0.4)"/>
  </g>
  
  <!-- Main book cover (front, in 3D perspective) -->
  <path d="M150,305 L540,325 L580,770 L190,750 Z" fill="url(#leatherBase)"/>
  <path d="M150,305 L540,325 L580,770 L190,750 Z" fill="url(#leatherHighlight)"/>
  
  <!-- Leather grain texture overlay on cover -->
  <path d="M150,305 L540,325 L580,770 L190,750 Z" fill="none" stroke="#6a2323" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,3"/>
  
  <!-- Ornate corner plates adjusted for 3D perspective -->
  <!-- Top-left corner -->
  <g filter="url(#emboss)">
    <path d="M205,305 L245,308 L245,314 L233,313 L230,353 L224,352 L227,313 L205,311 Z" fill="url(#goldGradient)"/>
    <path d="M205,305 Q210,310 205,315 L203,313 Q207,310 205,305" fill="#b8860b"/>
    <circle cx="225" cy="333" r="3" fill="#8b6914"/>
  </g>
  
  <!-- Top-right corner -->
  <g filter="url(#emboss)">
    <path d="M565,325 L525,322 L525,316 L537,317 L540,277 L546,278 L543,317 L565,319 Z" fill="url(#goldGradient)"/>
    <path d="M565,325 Q560,320 565,315 L567,317 Q563,320 565,325" fill="#b8860b"/>
    <circle cx="540" cy="297" r="3" fill="#8b6914"/>
  </g>
  
  <!-- Bottom-left corner -->
  <g filter="url(#emboss)">
    <path d="M225,725 L265,728 L265,722 L253,721 L250,681 L244,680 L247,721 L225,719 Z" fill="url(#goldGradient)"/>
    <path d="M225,725 Q230,720 225,715 L223,717 Q227,720 225,725" fill="#b8860b"/>
    <circle cx="245" cy="701" r="3" fill="#8b6914"/>
  </g>
  
  <!-- Bottom-right corner -->
  <g filter="url(#emboss)">
    <path d="M605,770 L565,767 L565,761 L577,762 L580,722 L586,723 L583,762 L605,764 Z" fill="url(#goldGradient)"/>
    <path d="M605,770 Q600,765 605,760 L607,762 Q603,765 605,770" fill="#b8860b"/>
    <circle cx="580" cy="743" r="3" fill="#8b6914"/>
  </g>
  
  <!-- Ornate filigree border with 3D perspective -->
  <g stroke="url(#goldGradient)" fill="none" stroke-width="2" opacity="0.8" filter="url(#emboss)">
    <!-- OUTER border: only bottom-right corner changed -->
    <path d="M200,300 L570,318 L590,748 L220,730 Z"/>
    <!-- INNER border: only bottom-right corner changed -->
    <path d="M210,310 L560,326 L580,738 L230,722 Z"/>
  </g>
  
  <!-- Decorative flourishes with perspective -->
  <g stroke="url(#goldGradient)" fill="none" stroke-width="1.5" opacity="0.7">
    <!-- Top center flourish -->
    <path d="M360,310 Q390,312 420,315" stroke-linecap="round"/>
    <path d="M370,315 
             C380,318 390,318 400,316" stroke-linecap="round"/>
    <path d="M390,318 L392,322" stroke-linecap="round"/>
    
    <!-- Bottom center flourish -->
    <path d="M320,720 Q380,728 440,732" stroke-linecap="round"/>
    <path d="M340,725 
             C360,730 380,732 400,731" stroke-linecap="round"/>
    <path d="M380,732 L382,736" stroke-linecap="round"/>
  </g>
  
  <!-- Arcane symbols in corners with 3D positioning -->
  <!-- Top-left: Alchemy symbol -->
  <g opacity="0.7" fill="url(#goldGradient)" filter="url(#emboss)">
    <circle cx="225" cy="333" r="12" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <path d="M225,323 L225,343 M215,333 L235,333" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <circle cx="225" cy="333" r="5" fill="none" stroke="url(#goldGradient)" stroke-width="1"/>
  </g>
  
  <!-- Top-right: Moon phases -->
  <g opacity="0.7" fill="url(#goldGradient)" filter="url(#emboss)">
    <circle cx="540" cy="345" r="8" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <path d="M536,345 A8,8 0 0,0 544,345" fill="url(#goldGradient)"/>
  </g>
  
  <!-- Bottom-left: Pentagram -->
  <g opacity="0.7" stroke="url(#goldGradient)" fill="none" filter="url(#emboss)">
    <circle cx="245" cy="701" r="12" stroke-width="1"/>
    <path d="M245,689 L239,705 L253,695 L237,695 L251,705 Z" stroke-width="1.5"/>
  </g>
  
  <!-- Bottom-right: Candle glyph -->
  <g opacity="0.7" fill="url(#goldGradient)" filter="url(#emboss)">
    <rect x="570" y="730" width="6" height="22" rx="2"/>
    <circle cx="573" cy="726" r="3"/>
  </g>
  
  <!-- Inner glow to emphasize the title area -->
  <ellipse cx="405" cy="515" rx="230" ry="150" fill="url(#magicalGlow)" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Main title "Dream Tome" with embossed effect and perspective -->
  <g filter="url(#emboss)" transform="rotate(2 405 500)">
    <text x="405" y="480" font-family="serif" font-size="58" font-weight="bold" 
          fill="url(#goldGradient)" text-anchor="middle" letter-spacing="4">
      Dream
    </text>
    <text x="415" y="550" font-family="serif" font-size="58" font-weight="bold" 
          fill="url(#goldGradient)" text-anchor="middle" letter-spacing="4">
      Tome
    </text>
  </g>
  
  <!-- Title highlight shine with perspective -->
  <g opacity="0.6" fill="#ffd700" filter="url(#goldShine)" transform="rotate(2 405 500)">
    <text x="405" y="480" font-family="serif" font-size="58" font-weight="bold" 
          text-anchor="middle" letter-spacing="4">
      Dream
    </text>
    <text x="415" y="550" font-family="serif" font-size="58" font-weight="bold" 
          text-anchor="middle" letter-spacing="4">
      Tome
    </text>
  </g>
  
  <!-- Left edge (meeting spine) highlight -->
  <path d="M190,290 L192,292 L212,738 L210,736 Z" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Spine highlight edge -->
  <path d="M140,290 L142,292 L182,735 L180,733 Z" fill="rgba(255,255,255,0.12)"/>
  
  <!-- Final outer glow for magical effect with 3D perspective -->
  <path d="M150,305 L540,325 L580,770 L190,750 Z" fill="none" 
        stroke="#ffd700" stroke-width="1" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Subtle page glow from bottom -->
  <path d="M190,745 L200,750 L620,790 L610,785 Z" fill="none" 
        stroke="#fff5e6" stroke-width="1" opacity="0.4"/>
</svg>
